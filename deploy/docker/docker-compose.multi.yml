version: '3.8'

services:
  # Instance 1 - SSH Honeypot (Port 22)
  rustbucket-ssh:
    build:
      context: .
      dockerfile: Dockerfile
    image: rustbucket:latest
    container_name: rustbucket-ssh
    restart: unless-stopped
    hostname: rustbucket-ssh

    environment:
      - CHATGPT_API_KEY=${CHATGPT_API_KEY}
      - S3_LOGGING_ENABLED=${S3_LOGGING_ENABLED:-false}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME:-}
      - S3_REGION=${S3_REGION:-us-east-1}
      - S3_PREFIX=ssh-honeypot  # Unique prefix for this instance
      - S3_DELETE_AFTER_UPLOAD=${S3_DELETE_AFTER_UPLOAD:-false}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}

    ports:
      - "22:22"    # SSH on standard port

    cap_add:
      - NET_BIND_SERVICE

    volumes:
      - rustbucket-ssh-logs:/app/logs

    healthcheck:
      test: ["CMD", "pgrep", "-x", "rustbucket"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3

  # Instance 2 - Web Honeypot (Port 80)
  rustbucket-http:
    build:
      context: .
      dockerfile: Dockerfile
    image: rustbucket:latest
    container_name: rustbucket-http
    restart: unless-stopped
    hostname: rustbucket-http

    environment:
      - CHATGPT_API_KEY=${CHATGPT_API_KEY}
      - S3_LOGGING_ENABLED=${S3_LOGGING_ENABLED:-false}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME:-}
      - S3_REGION=${S3_REGION:-us-east-1}
      - S3_PREFIX=http-honeypot  # Unique prefix
      - S3_DELETE_AFTER_UPLOAD=${S3_DELETE_AFTER_UPLOAD:-false}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}

    ports:
      - "80:80"    # HTTP on standard port

    cap_add:
      - NET_BIND_SERVICE

    volumes:
      - rustbucket-http-logs:/app/logs

    healthcheck:
      test: ["CMD", "pgrep", "-x", "rustbucket"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3

  # Instance 3 - Mail Honeypot (Port 25)
  rustbucket-smtp:
    build:
      context: .
      dockerfile: Dockerfile
    image: rustbucket:latest
    container_name: rustbucket-smtp
    restart: unless-stopped
    hostname: rustbucket-smtp

    environment:
      - CHATGPT_API_KEY=${CHATGPT_API_KEY}
      - S3_LOGGING_ENABLED=${S3_LOGGING_ENABLED:-false}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME:-}
      - S3_REGION=${S3_REGION:-us-east-1}
      - S3_PREFIX=smtp-honeypot  # Unique prefix
      - S3_DELETE_AFTER_UPLOAD=${S3_DELETE_AFTER_UPLOAD:-false}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}

    ports:
      - "25:25"    # SMTP on standard port

    cap_add:
      - NET_BIND_SERVICE

    volumes:
      - rustbucket-smtp-logs:/app/logs

    healthcheck:
      test: ["CMD", "pgrep", "-x", "rustbucket"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3

  # Instance 4 - FTP Honeypot (Port 21)
  rustbucket-ftp:
    build:
      context: .
      dockerfile: Dockerfile
    image: rustbucket:latest
    container_name: rustbucket-ftp
    restart: unless-stopped
    hostname: rustbucket-ftp

    environment:
      - CHATGPT_API_KEY=${CHATGPT_API_KEY}
      - S3_LOGGING_ENABLED=${S3_LOGGING_ENABLED:-false}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME:-}
      - S3_REGION=${S3_REGION:-us-east-1}
      - S3_PREFIX=ftp-honeypot  # Unique prefix
      - S3_DELETE_AFTER_UPLOAD=${S3_DELETE_AFTER_UPLOAD:-false}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}

    ports:
      - "21:21"    # FTP on standard port

    cap_add:
      - NET_BIND_SERVICE

    volumes:
      - rustbucket-ftp-logs:/app/logs

    healthcheck:
      test: ["CMD", "pgrep", "-x", "rustbucket"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3

volumes:
  rustbucket-ssh-logs:
    driver: local
  rustbucket-http-logs:
    driver: local
  rustbucket-smtp-logs:
    driver: local
  rustbucket-ftp-logs:
    driver: local
