version: '3.8'

services:
  rustbucket:
    build:
      context: .
      dockerfile: Dockerfile
    image: rustbucket:latest
    container_name: rustbucket
    restart: unless-stopped

    # Environment variables
    environment:
      - CHATGPT_API_KEY=${CHATGPT_API_KEY}
      - S3_LOGGING_ENABLED=${S3_LOGGING_ENABLED:-false}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME:-}
      - S3_REGION=${S3_REGION:-us-east-1}
      - S3_PREFIX=${S3_PREFIX:-}
      - S3_DELETE_AFTER_UPLOAD=${S3_DELETE_AFTER_UPLOAD:-false}
      - RUSTBUCKET_REGISTRY_URL=${RUSTBUCKET_REGISTRY_URL:-}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}

    # Port mappings
    ports:
      - "22:22"    # SSH
      - "21:21"    # FTP
      - "25:25"    # SMTP
      - "80:80"    # HTTP
      - "53:53"    # DNS (future)
      - "53:53/udp"

    # Add capability to bind privileged ports as non-root user
    cap_add:
      - NET_BIND_SERVICE

    # Persist logs
    volumes:
      - rustbucket-logs:/app/logs
      - ./Config.toml:/app/Config.toml:ro  # Optional: mount custom config

    # Health check
    healthcheck:
      test: ["CMD", "pgrep", "-x", "rustbucket"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3

    # Resource limits (optional - adjust as needed)
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M

volumes:
  rustbucket-logs:
    driver: local
